{% extends "base.html" %}

{% block body %}
<main class="login-wrapper">

        <p class="display-1 fw-bold text-body-secondary mb-0">{{ code }}</p>

        <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}" data-no-nav>Kembali ke Dashboard</a>
    </div>
</main>
{% endblock %}
