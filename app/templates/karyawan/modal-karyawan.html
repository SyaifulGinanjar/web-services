<div class="modal fade" id="modalKaryawan" tabindex="-1" aria-labelledby="modalKaryawanLabel" aria-hidden="true"
     {% if open_modal %}data-open-on-load{% endif %}>
    <div class="modal-dialog">
        <form class="modal-content" action="{{ url_for('karyawan.create') }}" method="POST" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="modalKaryawanLabel">Tambah Karyawan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {{ ui.input('nama', 'Nama', form if open_modal, errors if open_modal, placeholder='Nama karyawan') }}
                {{ ui.input('no_tlpn', 'No. Telepon', form if open_modal, errors if open_modal, type='tel', placeholder='08xxxxxxxxxx') }}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>
