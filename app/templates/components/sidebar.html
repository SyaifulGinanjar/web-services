<aside class="app-sidebar text-white" id="sidebar">
    <div class="sidebar-inner">
        {% for group, items in nav_menu %}
        <p class="sidebar-heading">{{ group }}</p>
        <nav class="mb-4">
            {% for endpoint, label, section in items %}
            <a class="sidebar-link {% if active_section == section %}active{% endif %}"
               href="{{ url_for(endpoint) }}" data-section="{{ section }}"
               {% if active_section == section %}aria-current="page"{% endif %}>{{ label }}</a>
            {% endfor %}
        </nav>
        {% endfor %}
    </div>
    <div class="sidebar-footer">
        <p class="text-white-50 small mb-1">Login sebagai:</p>
        <p class="fw-semibold mb-0">{{ current_user }}</p>
    </div>
</aside>
