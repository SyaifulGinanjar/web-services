<div class="modal fade" id="modalCustomer" tabindex="-1" aria-labelledby="modalCustomerLabel" aria-hidden="true"
     {% if open_modal %}data-open-on-load{% endif %}>
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <form class="modal-content" action="{{ url_for('customer.create') }}" method="POST" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="modalCustomerLabel">Tambah Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body">
                {% with form = form if open_modal else none, errors = errors if open_modal else {} %}
                {% include 'customer/_form.html' %}
                {% endwith %}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>
